<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MX Planilhas mudou de endereço · MAXIMOS</title>
<meta name="robots" content="noindex">
<!-- O Hub antigo virou o MX Planilhas, que mora em planilhas.maximosapp.com.br.
     Esta página só existe para quem ainda tem o endereço velho salvo. -->
<link rel="canonical" href="https://planilhas.maximosapp.com.br/">
<meta http-equiv="refresh" content="2; url=https://planilhas.maximosapp.com.br/">
<script>
  // Leva junto o caminho e a busca, para link antigo profundo não cair na capa.
  (function () {
    var destino = "https://planilhas.maximosapp.com.br" +
      (location.pathname === "/" ? "/" : location.pathname) + location.search + location.hash;
    setTimeout(function () { location.replace(destino); }, 1200);
    document.addEventListener("DOMContentLoaded", function () {
      var a = document.getElementById("ir"); if (a) a.href = destino;
    });
  })();
</script>
<style>
  :root { --verde:#049c74; --tinta:#1f2328; --suave:#6b7178; --fundo:#eef0f2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--fundo); color:var(--tinta);
         font:15px/1.55 Inter, "Segoe UI", system-ui, sans-serif; }
  main { max-width:440px; background:#fff; border:1px solid #dde1e6; border-radius:16px;
         padding:32px 30px; text-align:center; box-shadow:0 8px 30px rgba(15,23,42,.06); }
  h1 { font:700 20px/1.3 Sora, Inter, system-ui, sans-serif; letter-spacing:-.02em; margin-bottom:8px; }
  p { color:var(--suave); }
  a { display:inline-block; margin-top:20px; padding:11px 20px; border-radius:10px;
      background:var(--verde); color:#fff; text-decoration:none; font-weight:600; }
  small { display:block; margin-top:16px; color:var(--suave); font-size:12.5px; }
</style>
</head>
<body>
<main>
  <h1>O MX Planilhas mudou de endereço</h1>
  <p>O antigo Hub de planilhas virou o <b>MX Planilhas</b>. Levando você para lá agora.</p>
  <a id="ir" href="https://planilhas.maximosapp.com.br/">Abrir o MX Planilhas</a>
  <small>Endereço novo: planilhas.maximosapp.com.br — vale atualizar o favorito.</small>
</main>
</body>
</html>
